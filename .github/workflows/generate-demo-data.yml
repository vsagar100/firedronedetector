name: Generate thermal demo dataset

on:
  workflow_dispatch:
  push:
    branches:
      - feature/multi-screen-dashboard
    paths:
      - scripts/generate_demo_thermal_pairs.py
      - scripts/__init__.py
      - .github/workflows/generate-demo-data.yml

permissions:
  contents: write

jobs:
  generate-demo-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/multi-screen-dashboard
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate 13 thermal comparison pairs and event evidence
        run: python -m scripts.generate_demo_thermal_pairs

      - name: Commit generated image dataset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/non_fire data/current static/results logs/events.csv
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git commit -m "Add 13 thermal fire and safe comparison pairs"
          git push origin HEAD:feature/multi-screen-dashboard
